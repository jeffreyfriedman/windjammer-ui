[package]
name = "gpu-scene"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
vello = "0.11"
parley = "0.12"
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "gpu_scene_wasm"
path = "src/lib.rs"
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
