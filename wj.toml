[package]
name = "windjammer-ui"
version = "0.3.6"
edition = "2025"

[app_capabilities]
allow = []
deny = ["fs_read", "fs_write", "net_egress", "net_ingress", "process_spawn"]

# Modules compiled only with the `desktop` Cargo feature (hand-written egui/eframe modules merged into
# src/components/generated). The compiler gates exactly these; it no longer guesses from `desktop_*` / `app_*` names.
[module_features]
desktop = ["app_docking", "app_reactive_eframe", "desktop_app_context", "desktop_renderer", "desktop_renderer_v2"]
